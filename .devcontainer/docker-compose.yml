services:
  web:
    build: web
    depends_on:
      - mydb
    volumes:
      - odoo-home:/var/lib/odoo
      - odoo-dev-code:/src
    ports:
      - "8089:8069" 
    expose:
      - "8888"    
    environment:
      - db_host=mydb
      - db_password=myodoo
      - db_user=odoo
  test:
    build: test
    depends_on:
      - mydb
    volumes:
      - odoo-home:/var/lib/odoo
      - odoo-dev-code:/src
      - odoo-test-data:/tmp/screencasts
    environment:
      - db_host=mydb
      - db_password=myodoo
      - db_user=odoo
    stdin_open: true
    ports:
      - "8087:8069" 

  mydb:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=myodoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    expose:
      - "5432"

  dbadmin:
    image: dpage/pgadmin4
    depends_on:
      - mydb
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@odoo.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8088:80" 


volumes:
  odoo-dev-code:
  odoo-db-data:
  odoo-test-data:
  odoo-home: